name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codex-runtime:
    name: Codex runtime (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-14
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Initialize packaged Codex app-server
        run: bun run test:codex-runtime

  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            install-command: bun run install:python:full
            python-environment: .venv-build/windows-x64-full
          - runner: macos-15-intel
            install-command: bun run install:python:mac-x64
            python-environment: .venv-build/macos-x64-mac-intel-transcription
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      UV_PYTHON_PREFERENCE: managed
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/${{ matrix.python-environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install managed Python
        run: uv python install 3.13

      - name: Install macOS audio dependency
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: ${{ matrix.install-command }}

      - name: Run lint
        run: bun run lint

      - name: Run frontend tests
        run: bun run test:frontend

      - name: Run build script tests
        run: bun run test:scripts

      - name: Run backend tests
        run: uv run --no-sync python -m pytest tests -q

      - name: Run Python lint
        run: uv run --no-sync ruff check .

      - name: Verify Intel native transcription imports
        if: runner.os == 'macOS'
        run: >-
          uv run --no-sync python -c
          "import ctranslate2, faster_whisper, onnxruntime, pyaudio;
          audio = pyaudio.PyAudio(); audio.terminate();
          print('Intel native transcription imports passed')"

      - name: Transpile Electron process
        run: bun run transpile:electron

      - name: Compile channel bridge
        run: bun run build:channel-bridge
